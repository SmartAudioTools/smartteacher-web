<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTeacher</title>
<link rel="icon" href="teacher.svg">
<style>
  /* L'accueil, le temps que Pyodide-Qt se charge ; ce que l'élève voit ensuite est dessiné par Qt, dans le canevas. */
  body { margin: 0; background: #fbfbfb; color: #000; font: 12pt Carlito, Calibri, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  #accueil { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
  #identite { display: grid; gap: 10px; }
  #identite label { display: grid; gap: 3px; }
  #identite input { font: inherit; padding: 4px; }
  #message { color: #707070; font-style: italic; min-height: 1.4em; }
  #accueil h1, #message { text-align: center; }  /* dans l'axe du cercle d'avancement */
  /* l'avancement (--p de 0 à 1, data-pourcent) : sous le message, un grand camembert plein qui remplit un cercle vide, le
     pourcentage au milieu (demande de l'utilisateur, 02/10/2026 : que l'élève le voie avancer même quand le pourcentage
     reste figé ; au bord, 1 % ≈ 6 px) ; au dixième près, et toujours en mouvement (04/10/2026, `avancement` de qtpy6web.js). --p déclaré par @property pour glisser d'une valeur à la suivante au lieu de sauter. */
  @property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
  #message.attente { transition: --p .2s linear; }  /* l'avancement change toutes les 100 ms (qtpy6web.js) */
  #message.attente::after { content: attr(data-pourcent); display: block; box-sizing: border-box; width: 180px; height: 180px;
    margin: 20px auto 0; border: 2px solid #a0a0a0; border-radius: 50%; line-height: 176px; text-align: center;
    font-size: 1.8em; font-style: normal; font-weight: bold; color: #202020; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 2px #fff;
    background: conic-gradient(#5b9be6 calc(var(--p) * 1turn), transparent 0); }
  .erreur { color: #c0392b; font-style: normal; }
  /* Qt prend pour écran la taille du conteneur dès le chargement : l'épreuve, même cachée, occupe la fenêtre entière */
  #epreuve { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #epreuve[hidden] { display: flex !important; visibility: hidden; }
  #bandeau { margin: 0; padding: 2px 16px; min-height: 1.4em; font-size: .85em; color: #505050; }
  /* rien à dire (pont_qt ne parle que d'un échec d'envoi) : pas de bandeau, le canevas prend toute la hauteur */
  #bandeau:has(#statut:empty):has(#telecharger[hidden]) { display: none; }
  #qt { flex: 1; min-height: 0; }
  /* ?journal : le journal de la page par-dessus tout, pour voir sur un téléphone ce qui se passe sans outils de développement */
  #journal { position: fixed; left: 0; right: 0; bottom: 0; max-height: 45vh; overflow: auto; margin: 0; padding: 4px 8px; z-index: 1;
    background: #000c; color: #fff; font: 11px monospace; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<section id="accueil">
  <h1>SmartTeacher</h1>
  <form id="identite">
    <label id="ligne-fichier" hidden>Sujet <input type="file" name="fichier" accept=".qcm"></label>
    <p id="message" class="attente" data-pourcent="0 %">Préparation de la page…</p>
  </form>
</section>
<main id="epreuve" hidden>
  <p id="bandeau"><span id="statut"></span> <a id="telecharger" hidden>Télécharger ma copie</a></p>
  <div id="qt"></div>
</main>
<pre id="journal" hidden></pre>
<script type="module">
// Le lecteur natif (PyQt6) dans le navigateur, accueil compris : nom, prénom et code de déverrouillage sont demandés par
// la boîte du lecteur lui-même (lecteur.Accueil), dans le canevas, la même qu'en natif. La page charge Pyodide, fournit le
// sujet et, déployée (DROPBOX : le dossier d'application Dropbox du professeur, dropbox.js), fait passer les copies (pont_qt) :
//   ?sujet=x.qcm : le sujet à côté de la page, ou dans le dossier Dropbox du professeur (sinon l'élève choisit le fichier) ;
//   ?eleve=Nom Prénom : l'épreuve commence sans passer par l'accueil (la sonde, l'essai de déploiement).
// window.etat : "en cours", puis "accueil", "epreuve" ou "erreur" (ce que lit qtpy6.web.sonde) ; window.envoi : {date, chemin} du
// dernier envoi réussi ; window.py : Pyodide (essai_deploiement.py).
// Les cinq constantes : les valeurs locales ici (développement, sonde) ; construire.py --hote écrit dans pyqt6/index.html, la
// page que deployer.sh publie sur l'hôte statique, les adresses déployées, une par ligne, telles quelles : Pyodide-Qt publié par
// qtpy6 — pour la page ET pour les workers des questions code (un seul Pyodide téléchargé, 05/10/2026) —, l'hôte statique
// (où sont lecteur_qt.js et ce qu'il charge), la version ajoutée en requête, et la clé du dossier Dropbox du professeur
// (dropbox.js). ROUES_PYODIDE dérive de PYODIDE (pas de réécriture) : ce que Pyodide-Qt n'a pas et qu'un script d'élève
// peut importer, chargé par le worker au premier import (travailleur de qtpy6.web) ; adresse finissant par .whl, sans
// VERSION (en-tête de lecteur_qt.js).
const PYODIDE_QT = "https://smartaudiotools.github.io/qtpy6/pyodide-qt/";
const PYODIDE = "https://smartaudiotools.github.io/qtpy6/pyodide-qt/";
const HOTE = "https://smartaudiotools.github.io/smartteacher-web/";
const VERSION = "?v=1791449353";
const DROPBOX = "b244bHpmeG80bDc5aTZnIGttZV9RSjh4dmMwQUFBQUFBQUFBQVFzWlg1dkRYdnJSbktjUzhpdHZseTZDSEN6TW9NWk1UZ0oyNGh2bFNjLVk=";
const ROUES_PYODIDE = [PYODIDE + "sqlite3-1.0.0-cp313-cp313-pyodide_2025_0_wasm32.whl"];
window.etat = "en cours";
const params = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);

// Une erreur : l'accueil revient au premier plan avec le message et la fin du journal (sans quoi une erreur levée une fois
// l'épreuve montrée laissait un canevas blanc, sans rien à lire), et le journal s'affiche en entier.
function echec(erreur) {
  console.error(erreur);
  $("#epreuve").hidden = true;
  $("#accueil").hidden = false;
  message("La page n'a pas pu se préparer : " + (erreur?.message ?? erreur), true);
  $("#journal").hidden = false;
  $("#journal").textContent = (window.journal || []).join("\n");
  window.etat = "erreur";
}
// Les erreurs que personne n'attrape vont au journal seulement : une bénigne (boucle de ResizeObserver) cacherait une épreuve qui marche.
function noter(m) {
  const l = `non rattrapée : ${m}`;
  window.journal?.push(l);
  if (params.has("journal")) { $("#journal").hidden = false; $("#journal").textContent += l + "\n"; }
}
window.addEventListener("error", e => noter(e.error?.stack ?? e.message));
window.addEventListener("unhandledrejection", e => noter(e.reason?.stack ?? e.reason));

function message(texte, erreur = false) {
  $("#message").textContent = texte;
  $("#message").classList.toggle("erreur", erreur);
  $("#message").classList.toggle("attente", !erreur && texte.endsWith("…"));
}

$("#identite").onsubmit = e => e.preventDefault();  // Entrée dans la page ne la recharge pas
try {
  const [{ preparer, lancer, print, rendu, service_worker }, prof] = await Promise.all([import(HOTE + "lecteur_qt.js" + VERSION),
    DROPBOX && import(HOTE + "dropbox.js" + VERSION).then(m => m.professeur(DROPBOX))]);
  // La page déployée confie au service worker de qtpy6 (sw.js, déposé à côté par construire.py) Pyodide-Qt et les fichiers de
  // l'hôte qu'elle vient de charger : le QCM suivant les aura sans aucune requête. Pas en développement (VERSION vide) : un
  // cache y servirait des fichiers périmés. pyodide : le Pyodide des workers (le même Pyodide-Qt que la page), dont sw.js
  // sert les fichiers bruts aux workers neufs depuis l'entrée de leur jumeau ; il est dans la requête d'enregistrement, donc
  // dans le nom du cache : changer de Pyodide repart sur un cache neuf. « smartteacher » : le préfixe des caches de cette
  // application, dont ceux d'avant le 05/10/2026 (« smartteacher?v=… »), effacés à l'activation.
  const garder = VERSION ? service_worker(HOTE + "sw.js" + VERSION, { cache: "smartteacher", pyodide: PYODIDE, erreur: noter }) : () => {};
  const sur_ligne = params.has("journal") ? l => { $("#journal").hidden = false; $("#journal").textContent += l + "\n"; } : undefined;
  // Ce que la page offre au pont (pont_qt.demarrer) : le lien de la copie, l'état pour la sonde, une ligne de statut pour
  // l'élève, et chez le professeur la copie qui part et qui revient (dropbox.js : lire, ecrire, deplacer) ; le cours, à côté du
  // sujet (chez le professeur, ou par l'adresse du sujet).
  const page = {
    lien: $("#telecharger"),
    etat: async e => { await rendu(); print(`${e} : canevas ${$("#qt").clientWidth} x ${$("#qt").clientHeight}`); window.etat = e; },
    statut: (texte, erreur = false) => { $("#statut").textContent = texte; $("#statut").classList.toggle("erreur", erreur); print(texte); },
  };
  if (prof) Object.assign(page, {
    lire: prof.lire,
    ecrire: async (chemin, copie) => { const date = await prof.ecrire(chemin, copie); window.envoi = { date, chemin }; return date; },
    deplacer: prof.deplacer,
    presence: prof.presence,
  });
  const commencer = octets => {
    $("#accueil").hidden = true;
    $("#epreuve").hidden = false;
    lancer(octets, params.get("eleve"), page, params.get("code"));
  };
  const sujet = params.get("sujet");
  if (sujet) page.cours = prof ? chemin => prof.cours(sujet, chemin) : async chemin => {
    const reponse = await fetch(new URL(chemin, new URL(sujet, location.href)));
    return reponse.ok ? new Uint8Array(await reponse.arrayBuffer()) : null;
  };
  $("#ligne-fichier").hidden = !!sujet;
  // Le sujet se télécharge pendant que Pyodide-Qt se charge (chez le professeur : jeton puis fichier, deux allers-retours
  // vers Dropbox) ; l'avancement de la préparation va jusqu'à 95 %, le sujet reçu fait le reste.
  const octets = !sujet ? null : (prof ? prof.fichier(sujet) : fetch(sujet).then(async reponse => {
    if (!reponse.ok) throw new Error(`${sujet} introuvable (${reponse.status})`);
    return new Uint8Array(await reponse.arrayBuffer());
  }));
  octets?.catch(() => {});  // attendue plus bas : une erreur précoce n'est pas « non rattrapée »
  const avancer = f => { $("#message").style.setProperty("--p", f); $("#message").dataset.pourcent = `${(Math.floor(f * 1000) / 10).toFixed(1).replace(".", ",")} %`; };
  window.py = await preparer($("#qt"), { indexURL: PYODIDE_QT, pyodide: PYODIDE, roues_pyodide: ROUES_PYODIDE, sur_ligne, progres: f => avancer(0.95 * f) });
  const [qt, hote] = [PYODIDE_QT, HOTE].map(p => new URL(p, location.href).href);
  garder(u => u.startsWith(qt) || u.startsWith(hote) && /\.(m?js|zip|whl|json|br)(\?|$)/.test(u));  // pas les sujets ni les cours
  if (sujet) {
    commencer(await octets);
  } else {
    message("");
    $("[name=fichier]").onchange = async e => commencer(new Uint8Array(await e.target.files[0].arrayBuffer()));
  }
} catch (erreur) {
  echec(erreur);
}
</script>
</body>
</html>
