<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation des tours</title>
<!-- L'agenda des tours (Reservation/, Apps Script) encadré dans une page à nous : essai pour ne plus voir le bandeau
     « Cette application a été créée par un utilisateur de Google Apps Script » (DONE, « Réservation des tours : page
     GitHub Pages », 09/10/2026). doGet autorise l'encadrement (XFrameOptionsMode.ALLOWALL). -->
<style>html,body{height:100%;margin:0}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- Cadre créé par le script à chaque affichage, adresse rendue unique : un cadre écrit dans le HTML est restauré par
     Firefox (onglet déjà ouvert, retour arrière) sur l'adresse intérieure de Google, à usage unique et déjà périmée
     → écran gris foncé (10/10/2026, téléphone). doGet ignore le paramètre v. -->
<script>
function ouvrir() {
  document.querySelectorAll('iframe').forEach(f => f.remove());
  const f = document.createElement('iframe');
  f.title = "Réservation des tours d'ordinateurs";
  f.src = 'https://script.google.com/macros/s/AKfycbx1YhW7btLQNYPbTXz10k7chPFXGjCDoaoT2SFduRukQXy-ckxXCRhDggXD0nIk50AuxA/exec?v=' + Date.now();
  document.body.appendChild(f);
}
ouvrir();
addEventListener('pageshow', e => { if (e.persisted) ouvrir(); }); // page reprise du cache de navigation
</script>
</body>
</html>
